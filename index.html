<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src https://script.google.com https://*.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Trecard</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trecard">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111417" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#ffffff;--text:#1c1c1e;--sub:#6b6b70;--line:#e5e5ea;--accent:#1c1c1e;--accent-text:#ffffff;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#111417;--text:#ecf0f3;--sub:#a0a8b0;--line:#2a3035;--accent:#ecf0f3;--accent-text:#111417;color-scheme:dark}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
/* The frame covers the full height; the app pads its header and navigation itself, using the
   insets this page reports (see sendLayout), so the home-indicator space is not added twice. */
#frame{position:fixed;top:0;bottom:0;left:env(safe-area-inset-left);right:env(safe-area-inset-right);width:calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));height:100%;border:0;background:var(--bg)}
#safeProbe{position:fixed;top:0;left:0;width:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));background:var(--bg);z-index:2}
[hidden]{display:none!important}
.box{width:100%;max-width:420px}
h1{font-size:20px;margin:0 0 12px}
p{margin:0 0 12px;color:var(--sub)}
ol{margin:0 0 16px;padding-left:1.3em}
button{display:block;width:100%;min-height:48px;margin:10px 0 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-weight:600}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
input{box-sizing:border-box;width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.err{color:#c0392b;min-height:1.6em;margin:8px 0 0}
</style>
</head>
<body>
<div id="safeProbe" aria-hidden="true"></div>
<iframe id="frame" title="Trecard" hidden referrerpolicy="no-referrer"></iframe>

<section class="panel" id="loading" hidden><div class="box"><p>読み込み中…</p></div></section>

<section class="panel" id="failed" hidden><div class="box">
  <h1 id="failedTitle">開けませんでした</h1>
  <p id="failedText">通信状態を確認して、再読み込みしてください。直らない場合は設定し直してください。</p>
  <button class="primary" id="reloadBtn" type="button">再読み込み</button>
  <button id="resetBtn" type="button">設定し直し</button>
  <button id="dismissBtn" type="button" hidden>このまま使う</button>
</div></section>

<section class="panel" id="install" hidden><div class="box">
  <h1>設定を保存しました</h1>
  <ol>
    <li>下の共有ボタン（□↑）を押す</li>
    <li>「ホーム画面に追加」→「追加」</li>
    <li>ホーム画面の Trecard アイコンから開く</li>
  </ol>
  <p>このページ（Safari）は閉じてかまいません。</p>
  <button id="openHereBtn" type="button">Safari でこのまま開く</button>
</div></section>

<section class="panel" id="push" hidden><div class="box">
  <h1>通知をオンにする</h1>
  <p>支払い・受け取りの期限、結果発表日、締切が近い抽選（ストア・X抽選）をこの iPhone に通知します。次の画面で「許可」を選んでください。</p>
  <p class="err" id="pushError"></p>
  <button class="primary" id="pushAllow" type="button">通知を許可する</button>
  <button id="pushCancel" type="button">やめる</button>
</div></section>

<section class="panel" id="setup" hidden><div class="box">
  <h1>Trecard の設定</h1>
  <p>PC で用意した設定用 URL を貼り付けてください。</p>
  <input id="setupInput" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="設定用 URL を貼り付け">
  <p class="err" id="setupError"></p>
  <button class="primary" id="setupSave" type="button">保存して開く</button>
</div></section>

<script>
(function(){
  "use strict";
  var STORE="trecard.app.config";          // {u: Web App URL, k: access key, c: setup code}
  var IGNORED="trecard.app.ignoredSetup";   // setup code the user chose to replace
  // The app's lists last shown and its logos (sent by the app after each load, never its key), handed back at the next
  // launch so the lists appear at once: what the Google frame keeps itself may be gone by then (3.14.3).
  var VIEW_DATA="trecard.app.viewData";     // {u: Web App URL it belongs to, at, data: the app's own JSON text}
  var ICONS="trecard.app.icons";            // {u, version, icons: {shop key: data:image/...}}
  var LAUNCHES="trecard.app.launches";      // how many times this page started (shown in the app's timing panel)
  var VIEW_DATA_MAX_CHARS=3000000;
  var READY_TIMEOUT_MS=25000;
  var URL_RE=/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{10,200}\/exec$/;
  var KEY_RE=/^[A-Za-z0-9_-]{32,256}$/;
  var FRAME_ORIGIN_RE=/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
  var $=function(id){return document.getElementById(id)};
  var standalone=window.navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches;
  var timer=0,ready=false,appNonce="",bootError="";

  function read(key){try{return window.localStorage.getItem(key)}catch(e){return null}}
  function write(key,value){try{window.localStorage.setItem(key,value);return window.localStorage.getItem(key)===value}catch(e){return false}}
  function remove(key){try{window.localStorage.removeItem(key)}catch(e){}}
  function show(id){["loading","failed","install","setup","push"].forEach(function(p){$(p).hidden=p!==id})}
  function clearHash(){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}

  // A setup code is base64url(JSON {v:1,u,k}); the whole setup URL may also be pasted.
  function parseSetup(text){
    var code=String(text||"").trim();
    var at=code.indexOf("#setup=");
    if(at>=0)code=code.slice(at+7);
    else if(code.indexOf("setup=")===0)code=code.slice(6);
    if(!/^[A-Za-z0-9_-]{20,2000}$/.test(code))return null;
    try{
      var b64=code.replace(/-/g,"+").replace(/_/g,"/");while(b64.length%4)b64+="=";
      var data=JSON.parse(atob(b64));
      if(!data||data.v!==1||!URL_RE.test(data.u)||!KEY_RE.test(data.k))return null;
      return {u:data.u,k:data.k,c:code};
    }catch(e){return null}
  }
  function stored(){
    try{var c=JSON.parse(read(STORE)||"null");return c&&URL_RE.test(c.u)&&KEY_RE.test(c.k)?c:null}catch(e){return null}
  }
  function save(config){return write(STORE,JSON.stringify(config))}
  function forgetAppData(){remove(VIEW_DATA);remove(ICONS)}
  function keptFor(key){try{var v=JSON.parse(read(key)||"null");return v&&openedConfig&&v.u===openedConfig.u?v:null}catch(e){return null}}
  var launches=0;try{launches=(Number(read(LAUNCHES))||0)+1;write(LAUNCHES,String(launches))}catch(e){launches=0}
  function validIcons(icons){
    if(!icons||typeof icons!=="object"||Array.isArray(icons))return null;
    var out={},keys=Object.keys(icons);if(keys.length>400)return null;
    for(var i=0;i<keys.length;i++){var v=icons[keys[i]];if(keys[i].length>200||typeof v!=="string"||v.indexOf("data:image/")!==0||v.length>200000)return null;out[keys[i]]=v}
    return out;
  }
  function sendKept(){
    var view=keptFor(VIEW_DATA),icons=keptFor(ICONS);
    toApp({type:"trecard:cache",data:view&&typeof view.data==="string"?view.data:"",launches:launches});
    if(icons&&icons.version&&icons.icons)toApp({type:"trecard:icons",version:icons.version,icons:icons.icons});
  }
  function keepForApp(data){
    if(!openedConfig)return;
    if(data.type==="trecard:cache-put"){
      if(typeof data.data!=="string"||data.data.length>VIEW_DATA_MAX_CHARS){toApp({type:"trecard:cache-saved",ok:false,reason:"too_large"});return}
      if(!data.data){remove(VIEW_DATA);return}
      var ok=write(VIEW_DATA,JSON.stringify({u:openedConfig.u,at:Date.now(),data:data.data}));
      if(!ok)remove(VIEW_DATA);
      toApp({type:"trecard:cache-saved",ok:ok,kb:Math.round(data.data.length/102.4)/10,reason:ok?"":"not_saved"});
      return;
    }
    var icons=validIcons(data.icons),version=typeof data.version==="string"&&/^[A-Za-z0-9-]{0,40}$/.test(data.version)?data.version:null;
    if(!icons||version===null)return;
    if(!version||!Object.keys(icons).length){remove(ICONS);return}
    if(!write(ICONS,JSON.stringify({u:openedConfig.u,version:version,icons:icons})))remove(ICONS);
  }

  function openApp(config){
    if(openedConfig&&(openedConfig.u!==config.u||openedConfig.k!==config.k))pendingOpen=null;
    openedConfig=config;intentStored=true;clearPushPrompt();
    app=null;appNonce="";pushKey="";
    try{
      var bytes=new Uint8Array(16);window.crypto.getRandomValues(bytes);
      appNonce=Array.from(bytes,function(b){return b.toString(16).padStart(2,"0")}).join("");
    }catch(e){fail("開けませんでした","安全な接続を準備できませんでした。ブラウザを更新してから再度開いてください。",false);return}
    ready=false;bootError="";show("loading");$("loading").hidden=false;
    var frame=$("frame");frame.hidden=false;
    frame.src=config.u+"?key="+encodeURIComponent(config.k)+"&wrapperNonce="+appNonce;
    clearTimeout(timer);
    timer=setTimeout(function(){if(!ready)fail("開けませんでした","通信状態を確認して、再読み込みしてください。直らない場合は設定し直してください。"+(bootError?"（画面のエラー："+bootError+"）":""),false)},READY_TIMEOUT_MS);
  }
  function fail(title,text,dismissable){
    $("failedTitle").textContent=title;$("failedText").textContent=text;$("dismissBtn").hidden=!dismissable;
    // A key mismatch is fixed by setting up again; anything else first deserves a reload.
    $("reloadBtn").className=dismissable?"":"primary";$("resetBtn").className=dismissable?"primary":"";
    show("failed");
  }
  function showSetup(message){
    clearPushPrompt();
    app=null;appNonce="";pushKey="";ready=false;
    $("frame").hidden=true;$("frame").removeAttribute("src");clearTimeout(timer);
    $("setupError").textContent=message||"";$("setupInput").value="";show("setup");
  }

  // Reply to the app with this page's safe-area insets (numbers only) so it can pad its header
  // and navigation even if the embedded page cannot read them itself.
  var app=null,openedConfig=null,intentStored=true;
  function embeddedSource(source){
    try{
      if(!source||source===window||source.closed)return false;
      var frameWindow=$("frame").contentWindow;
      for(var i=0;i<8&&source;i++){
        if(source===frameWindow)return true;
        var parent=source.parent;
        if(!parent||parent===source||parent===window)return false;
        source=parent;
      }
    }catch(e){}
    return false;
  }
  function insets(){var s=window.getComputedStyle($("safeProbe"));return {top:parseFloat(s.paddingTop)||0,bottom:parseFloat(s.paddingBottom)||0}}
  function sendLayout(){
    if(!app)return;var i=insets();
    toApp({type:"trecard:layout",safeTop:i.top,safeBottom:i.bottom});
  }
  window.addEventListener("resize",sendLayout);
  window.addEventListener("orientationchange",sendLayout);

  // ---- notifications (Web Push) ----
  // The app (in the frame) asks for the state or a subscription; permission is asked only after a tap in this page
  // (iOS shows notifications only for an app added to the home screen). The subscription goes back to the app,
  // which saves it with its access key. Nothing secret is kept here: the public key comes from the app.
  var pushKey="",pendingOpen=null,subscribeOperation=null,pushQueue=Promise.resolve();
  var pushSupported=function(){return "serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window};
  if(standalone&&"serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}}
  function toApp(message){if(!app||!appNonce)return;try{app.source.postMessage(Object.assign({},message,{nonce:appNonce}),app.origin)}catch(e){}}
  function pushBinding(){return app&&!app.legacy&&appNonce?{app:app,nonce:appNonce}:null}
  function currentBinding(binding){return !!binding&&app===binding.app&&appNonce===binding.nonce&&!app.legacy}
  function operation(data,binding){return {action:data.action,id:data.operationId,binding:binding||pushBinding(),replied:false,cancelled:false,started:false}}
  function operationId(value){return typeof value==="number"&&Number.isInteger(value)&&value>0&&value<=2147483647}
  function clearPushPrompt(){if(subscribeOperation)subscribeOperation.cancelled=true;subscribeOperation=null;$("pushAllow").disabled=false}
  function rememberIntent(off){
    if(!openedConfig)return false;
    var next={u:openedConfig.u,k:openedConfig.k,c:openedConfig.c,pushOff:off};
    intentStored=save(next);openedConfig=next;return intentStored;
  }
  function basePushState(){return {type:"trecard:push-state",supported:pushSupported(),standalone:standalone,
    permission:"Notification" in window?Notification.permission:"unsupported",subscription:null,confirmed:false,
    intent:openedConfig&&typeof openedConfig.pushOff==="boolean"?(openedConfig.pushOff?"off":"on"):"",intentStored:intentStored}}
  function subscriptionState(sub){var state=basePushState();state.subscription=sub?sub.toJSON():null;return state}
  function replyPush(op,state,confirmed,error){
    if(op.replied||!currentBinding(op.binding))return;
    op.replied=true;state.action=op.action;state.operationId=op.id;state.confirmed=confirmed===true;
    if(error)state.error=error;else if(!state.intentStored)state.error="intent_not_saved";
    toApp(state);
  }
  function keyBytes(b64){var s=String(b64).replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var raw=atob(s),out=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}
  function pushState(){
    var base=basePushState();
    if(!base.supported||!standalone)return Promise.resolve(base);
    return navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription()}).then(function(sub){base.subscription=sub?sub.toJSON():null;base.confirmed=true;return base}).catch(function(){base.error="state_unavailable";return base});
  }
  function sendPushState(op,error){if(!currentBinding(op.binding))return;return pushState().then(function(state){replyPush(op,state,error?false:state.confirmed,error||state.error)})}
  function enqueueMutation(task){pushQueue=pushQueue.catch(function(){}).then(task).catch(function(){});return pushQueue}
  $("pushAllow").onclick=function(){
    var op=subscribeOperation;
    if(!op||op.started||op.cancelled||!currentBinding(op.binding))return;
    op.started=true;$("pushAllow").disabled=true;
    $("pushError").textContent="";
    // Keep the permission request in the button's user gesture, even when another browser mutation is pending.
    var permission;
    try{permission=Notification.requestPermission().then(function(value){return {value:value}},function(){return {error:"permission_failed"}})}catch(e){permission=Promise.resolve({error:"permission_failed"})}
    enqueueMutation(function(){
      return permission.then(function(answer){
        if(!currentBinding(op.binding))return;
        if(op.cancelled)return sendPushState(op,"cancelled");
        if(answer.error)return sendPushState(op,answer.error);
        if(answer.value!=="granted"){show(null);return sendPushState(op,answer.value==="denied"?"permission_denied":"permission_default")}
        return navigator.serviceWorker.ready.then(function(reg){
          if(!currentBinding(op.binding))return;
          if(op.cancelled)return sendPushState(op,"cancelled");
          return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:keyBytes(op.key)}).then(function(sub){
            if(!currentBinding(op.binding))return;
            if(op.cancelled)return sendPushState(op,"cancelled");
            rememberIntent(false);show(null);replyPush(op,subscriptionState(sub),true);
          });
        });
      }).catch(function(){if(currentBinding(op.binding)){show(null);return sendPushState(op,"subscribe_failed")}})
        .then(function(){if(subscribeOperation===op){subscribeOperation=null;$("pushAllow").disabled=false}});
    });
  };
  $("pushCancel").onclick=function(){var op=subscribeOperation;if(!op)return;op.cancelled=true;subscribeOperation=null;$("pushAllow").disabled=false;show(null);sendPushState(op,"cancelled")};
  function openTarget(target){
    if(typeof target!=="string"||target.length>=1300)return;
    if(app&&app.legacy){pendingOpen=null;return}
    if(ready&&app)toApp({type:"trecard:open",target:target});else pendingOpen=target;
  }
  if(location.hash.indexOf("#open=")===0){try{pendingOpen=decodeURIComponent(location.hash.slice(6))}catch(e){pendingOpen=null}clearHash()}
  if("serviceWorker" in navigator)navigator.serviceWorker.addEventListener("message",function(event){if(event.data&&event.data.type==="trecard:open")openTarget(event.data.target)});

  window.addEventListener("message",function(event){
    if(!FRAME_ORIGIN_RE.test(event.origin))return;
    var data=event.data;
    // Bind the actual Apps Script frame (including its sandboxed inner frame) to this load.
    // The token is passed only in that frame's address; a different Google-hosted window cannot replace it.
    if(!data||!appNonce||!embeddedSource(event.source))return;
    if(app&&(event.source!==app.source||event.origin!==app.origin))return;
    // Older friend deployments can still display their existing UI. They never receive push subscriptions.
    var legacy=data.nonce===undefined&&(app?app.legacy:data.type==="trecard:ready");
    if(data.nonce!==appNonce&&!legacy)return;
    if((data.type==="trecard:cache-put"||data.type==="trecard:icons-put")&&app){
      if(!app.legacy)keepForApp(data);
      return;
    }
    if(data.type==="trecard:push"&&app){
      if(app.legacy)return;
      if(!operationId(data.operationId))return;
      var op=operation(data);
      if(data.action==="status"){enqueueMutation(function(){return sendPushState(op)});return}
      if(data.action==="subscribe"&&/^[A-Za-z0-9_-]{86,88}$/.test(String(data.publicKey||""))){
        if(!pushSupported()||!standalone){sendPushState(op,"not_available");return}
        clearPushPrompt();op.key=String(data.publicKey);subscribeOperation=op;pushKey=op.key;show("push");return;
      }
      if(data.action==="subscribe"){sendPushState(op,"bad_public_key");return}
      if(data.action==="unsubscribe"){
        rememberIntent(true);clearPushPrompt();show(null);
        if(!pushSupported()||!standalone){sendPushState(op,"not_available");return}
        enqueueMutation(function(){
          var current=null;
          return navigator.serviceWorker.ready.then(function(reg){if(!currentBinding(op.binding))return;return reg.pushManager.getSubscription()}).then(function(sub){
            if(!currentBinding(op.binding))return;
            current=sub;if(!sub){replyPush(op,basePushState(),true);return}
            return sub.unsubscribe().then(function(removed){if(!currentBinding(op.binding))return;replyPush(op,removed===true?basePushState():subscriptionState(sub),removed===true,removed===true?null:"unsubscribe_failed")});
          }).catch(function(){if(currentBinding(op.binding)){if(current)replyPush(op,subscriptionState(current),false,"unsubscribe_failed");else return sendPushState(op,"unsubscribe_failed")}});
        });
        return;
      }
      return;
    }
    // The app could not prepare its screen (its boot guard reports the error name only). A fatal one is shown at once
    // instead of waiting for the ready timeout; one the app recovered from is kept for a later timeout message.
    if(data.type==="trecard:error"){
      if(legacy)return;
      var name=/^[A-Za-z]{1,40}$/.test(String(data.name))?String(data.name):"Error";bootError=name;
      if(data.fatal===true&&!ready){ready=true;clearTimeout(timer);fail("開けませんでした","画面の準備でエラーが起きました（"+name+"）。再読み込みしてください。直らない場合は、Trecard の更新を待ってください。",false)}
      return;
    }
    if(!data||data.type!=="trecard:ready")return;
    ready=true;clearTimeout(timer);
    if(data.state==="app"){
      app={source:event.source,origin:event.origin,legacy:legacy};sendLayout();if(!legacy){sendKept();var status=operation({action:"status",operationId:0});enqueueMutation(function(){return sendPushState(status)})}show(null);
      if(legacy)pendingOpen=null;
      else if(pendingOpen!==null){toApp({type:"trecard:open",target:pendingOpen});pendingOpen=null}return;
    }
    app=null;
    fail("キーが一致しません","アクセスキーが変わった可能性があります。設定し直してください。",true);
  });

  $("reloadBtn").onclick=function(){var c=stored();if(c)openApp(c);else showSetup("")};
  $("resetBtn").onclick=function(){
    pendingOpen=null;
    var c=stored();if(c&&c.c)write(IGNORED,c.c);
    remove(STORE);forgetAppData();clearHash();showSetup("");
  };
  $("dismissBtn").onclick=function(){show(null)};
  $("openHereBtn").onclick=function(){var c=stored();clearHash();if(c)openApp(c);else showSetup("")};
  $("setupSave").onclick=function(){
    var c=parseSetup($("setupInput").value);$("setupInput").value="";
    if(!c){$("setupError").textContent="設定用 URL の形式が正しくありません。";return}
    if(!save(c)){$("setupError").textContent="この端末に保存できませんでした。";return}
    remove(IGNORED);forgetAppData();openApp(c);
  };

  // Home-screen apps keep storage separate from Safari. The setup URL's #fragment stays in the
  // home-screen bookmark (it is never sent to a server), so the installed app can read it on its
  // first launch, or again if its storage was cleared; a fragment the user replaced is ignored.
  var fromHash=location.hash.indexOf("#setup=")===0?parseSetup(location.hash):null;
  if(location.hash&&!fromHash&&location.hash.indexOf("#setup=")===0){clearHash();showSetup("設定用 URL の形式が正しくありません。");return}
  var config=stored();
  if(fromHash&&(!config||!standalone)&&read(IGNORED)!==fromHash.c){config=fromHash;save(config)}
  if(standalone){
    clearHash();
    if(config)openApp(config);else showSetup("");
    return;
  }
  // In Safari: keep the fragment until "Add to Home Screen" so the icon carries it.
  if(fromHash){show("install");return}
  if(config)openApp(config);else showSetup("");
})();
</script>
